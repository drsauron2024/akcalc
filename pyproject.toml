[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akcalc"
version = "0.1.0"
description = "Ontology-grounded Arknights damage QA and calculation assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "pandas>=2.2",
    "numpy>=1.26",
    "sympy>=1.12",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "rapidfuzz>=3.9",
    "streamlit>=1.36",
    "networkx>=3.3",
    "pyvis>=0.3.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]
semantica = ["semantica>=0.7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/akcalc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
